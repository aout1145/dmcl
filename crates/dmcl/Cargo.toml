[package]
name = "dmcl"
description = "An unofficial Minecraft launcher written in Rust (migrated from the original D implementation)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# The application is a library (so a GUI / daemon can reuse the exact same
# config + front-end plumbing) plus the CLI binary.
[lib]
name = "dmcl"
path = "src/lib.rs"

[[bin]]
name = "dmcl"
path = "src/main.rs"

[build-dependencies]
built.workspace = true

[features]
default = []
# GTK4 + libadwaita 图形前端（relm4）。默认关，用 `--features gtk4` 开启；
# 需要系统装有 GTK4 / libadwaita 开发库。
gtk4 = ["dep:relm4", "dep:sysinfo", "dep:notify"]

[dependencies]
dmcl-task.workspace = true
dmcl-mcmeta = { workspace = true, features = ["clap"] }
dmcl-download.workspace = true
dmcl-install.workspace = true
dmcl-launch.workspace = true

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
sha1.workspace = true
dirs.workspace = true
anyhow.workspace = true
clap.workspace = true
dialoguer.workspace = true

# 图形前端：可选依赖，只有开启 `gtk4` feature 才编译。
relm4 = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
