on: [push, pull_request]

jobs:
  build:
    name: Build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace --release

      - uses: actions/upload-artifact@v4
        with:
          name: dmcl-${{ matrix.os }}
          path: |
            target/release/dmcl
            target/release/dmcl.exe

  # 图形前端默认关：单独一个 Linux 任务装 GTK 后，对 `--features gtk4` 做检查与构建。
  # Windows 不开这个 feature，上面的 build 任务不会编译 GUI，也就不需要装 GTK。
  gui:
    name: GUI (GTK4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # 需要 GTK ≥4.18 / libadwaita ≥1.7（用到 AdwWrapBox / AdwSpinner / AdwDialog）。
      - name: Install GTK4 / libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Clippy (gtk4)
        run: cargo clippy -p dmcl --features gtk4 --all-targets -- -D warnings

      - name: Test (gtk4)
        run: cargo test -p dmcl --features gtk4

      - name: Build (gtk4)
        run: cargo build -p dmcl --features gtk4 --release
