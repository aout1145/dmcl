# The launcher is a cargo workspace: one crate per responsibility.
#
#   dmcl-task      generic task chains + progress reporting (no MC knowledge)
#   dmcl-mcmeta    Minecraft metadata documents, download sources, url templates
#   dmcl-download  concurrent / chunked file downloads as a task
#   dmcl-install   materialise a version on disk (vanilla + Fabric/Forge/NeoForge)
#   dmcl-launch    accounts, java selection, command line generation, game monitor
#   dmcl           the application: config + cli + gui (GTK4, feature-gated)
#
# Nothing but `dmcl` itself knows about the config file: every other crate is
# configured by the caller (see each crate's `*Options` struct).
[workspace]
resolver = "2"
members = [
    "crates/dmcl",
    "crates/dmcl-task",
    "crates/dmcl-mcmeta",
    "crates/dmcl-download",
    "crates/dmcl-install",
    "crates/dmcl-launch",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.93"
license = "GPL-3.0-or-later"
authors = ["a_out_"]

[workspace.dependencies]
# workspace members
dmcl-task = { path = "crates/dmcl-task", version = "0.0.1" }
dmcl-mcmeta = { path = "crates/dmcl-mcmeta", version = "0.0.1" }
dmcl-download = { path = "crates/dmcl-download", version = "0.0.1" }
dmcl-install = { path = "crates/dmcl-install", version = "0.0.1" }
dmcl-launch = { path = "crates/dmcl-launch", version = "0.0.1" }

# external
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
path-clean = "1"
walkdir = "2"
uuid = "1"
dirs = "6"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
version-compare = "0.2"
regex = "1"
os_info = "3"
relm4 = { version = "0.11", features = ["libadwaita", "gnome_48"] }

[profile.release]
lto = true
strip = true
